# Messages the frontend shows to the user, in German (the default language).
# The English texts are in messages_en.properties; both files have the same keys.
# Spring picks the file from the Accept-Language header of the request (see architecture.md → Languages).

# Bean Validation of the request bodies (used in the dto records as message = "{key}")
validation.name.required=Bitte einen Namen eingeben.
validation.name.size=Der Name darf höchstens 100 Zeichen lang sein.
validation.place.required=Bitte einen Ort auswählen.
validation.coordinates.invalid=Ungültige Koordinaten.
validation.country.required=Bitte ein Land angeben.
validation.countryCode.invalid=Ungültiger Ländercode.
validation.stopType.required=Bitte auswählen, wie du hier warst.
validation.date.required=Bitte ein Datum wählen.
validation.note.size=Die Notiz darf höchstens 2000 Zeichen lang sein.
validation.title.size=Der Titel darf höchstens 100 Zeichen lang sein.
validation.description.size=Die Beschreibung darf höchstens 2000 Zeichen lang sein.
validation.startDate.required=Bitte ein Startdatum wählen.
validation.endDate.required=Bitte ein Enddatum wählen.
validation.color.invalid=Ungültige Farbe.
validation.destination.required=Bitte einen Ort oder ein Land eingeben.
validation.reason.required=Bitte einen Grund eingeben.
validation.priority.required=Bitte eine Priorität wählen.
