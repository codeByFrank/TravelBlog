error.trip.stopsOutsideDates=Einige Orte liegen außerhalb des neuen Zeitraums. Ändere zuerst ihr Datum.
error.trip.endBeforeStart=Das Enddatum darf nicht vor dem Startdatum liegen.
error.trip.photoNotInTrip=Dieses Foto gehört nicht zu dieser Reise.
error.stop.notFound=Ort nicht gefunden.
error.stop.lastStop=Eine Reise braucht mindestens einen Ort. Ändere ihn stattdessen.
