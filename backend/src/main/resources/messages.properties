# General errors (GlobalExceptionHandler)
error.invalidValue=Ungültiger Wert.
error.invalidInput=Die Eingaben sind ungültig.
error.unreadableRequest=Die Anfrage enthält ungültige Daten.

# Login and registration
error.username.taken=Dieser Benutzername ist bereits vergeben.
error.login.failed=Benutzername oder Passwort ist falsch.

# Trips and stops
error.trip.notFound=Reise nicht gefunden.
