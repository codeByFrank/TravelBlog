spring.application.name=backend
spring.mongodb.uri=${MONGODB_URI}

spring.mvc.problemdetails.enabled=true
app.jwt.secret=${JWT_SECRET}
# Password of the demo user with sample data; without it there is no demo user (see DemoDataSeeder)
app.demo.password=${DEMO_PASSWORD:}
# Place search (OpenStreetMap); no API key needed
app.nominatim.base-url=https://nominatim.openstreetmap.org
# First sentences of the Wikipedia article about a place; no API key needed.
# {language} is the language of the user interface, "de" or "en" (see WikipediaService)
app.wikipedia.base-url=https://{language}.wikipedia.org

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Languages of the user interface (see architecture.md → Languages): the frontend sends the chosen language in the
# Accept-Language header. Without the header the texts are German; a language without its own messages file, e.g.
# French, falls back to messages.properties (German) and not to the language of the server.
spring.web.locale=de
spring.messages.fallback-to-system-locale=false
