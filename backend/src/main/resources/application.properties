spring.application.name=backend
spring.mongodb.uri=${MONGODB_URI}

spring.mvc.problemdetails.enabled=true
app.jwt.secret=${JWT_SECRET}
# Password of the demo user with sample data; without it there is no demo user (see DemoDataSeeder)
app.demo.password=${DEMO_PASSWORD:}
# Place search (OpenStreetMap); no API key needed
app.nominatim.base-url=https://nominatim.openstreetmap.org
# First sentences of the Wikipedia article about a place; no API key needed
app.wikipedia.base-url=https://de.wikipedia.org

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Health check for Render (Actuator): only GET /actuator/health with "UP" or "DOWN", no details about the database
management.endpoints.web.exposure.include=health
# API documentation (springdoc): only the REST API, not the paths of the frontend pages (FrontendController)
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.tags-sorter=alpha
