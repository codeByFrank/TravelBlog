spring.application.name=backend
spring.mongodb.uri=${MONGODB_URI}

spring.mvc.problemdetails.enabled=true
app.jwt.secret=${JWT_SECRET}
# Place search (OpenStreetMap); no API key needed
app.nominatim.base-url=https://nominatim.openstreetmap.org
# First sentences of the Wikipedia article about a place; no API key needed
app.wikipedia.base-url=https://de.wikipedia.org

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
