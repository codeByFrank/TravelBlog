name: Prod deploy
on:
  push:
    branches:
      - main

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm ci installs exactly the versions from package-lock.json;
      # --ignore-scripts stops install scripts of the packages from running (the build does not need them)
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Upload Frontend-Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/*

  build-backend:
    needs: build-frontend
    # Not ubuntu-latest: the backend tests use an embedded MongoDB 7.0.4, which has no download for Ubuntu 26.04.
    # maven.yml and build_backend.yml use ubuntu-24.04 for the same reason.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # The frontend goes into the backend's static folder, so the backend delivers it (see docs/deployment.md)
      - name: Download Frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: backend/src/main/resources/static

      - name: Build with Maven
        run: mvn package --file backend/pom.xml

      - name: Upload Backend-Build
        uses: actions/upload-artifact@v4
        with:
          name: travelBlog-jar
          path: backend/target/travelBlog.jar

  push-to-docker-hub:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Backend
        uses: actions/download-artifact@v4
        with:
          name: 'travelBlog-jar'
          path: 'backend-target'

      # Actions from outside GitHub are pinned to a commit, because a tag like v4 can be moved to other code
      - name: Login to Docker
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker image names must be lowercase
      - name: Build and Push to Docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: 'true'
          tags: 'nataliadybina/travelblog:latest'

  deploy-to-render:
    needs: push-to-docker-hub
    runs-on: ubuntu-latest
    steps:
      # --fail makes the step red when Render rejects the call
      - name: Trigger Render Deploy
        run: |
          curl -X POST --fail "${{ secrets.RENDER_DEPLOY_HOOK }}"
